<h2>Lista de Posts</h2>

<div *ngIf="error" style="color:red;">
  {{ error }}
</div>

<table border="1" *ngIf="posts.length > 0">
  <thead>
    <tr>
      <th>ID</th>
      <th>Título</th>
      <th>Contenido</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let post of posts">
      <td>{{ post.id }}</td>
      <td>{{ post.title }}</td>
      <td>{{ post.body }}</td>
    </tr>
  </tbody>
</table>
